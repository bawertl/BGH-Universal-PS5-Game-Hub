name: BGH V1.1.30

on:
  push:
    branches: [bgh-v1.1.30]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bgh-v1.1.30-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: BGH V1.1.30 - Nativer PS5 Build und Pruefung
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Quellstand V1.1.30 auschecken
        uses: actions/checkout@v4

      - name: PS5-Buildwerkzeuge installieren
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-format-18 clang-tidy-18 lld-18 llvm-18 \
            make git ninja-build ccache pkg-config python3 python3-pip python3-venv \
            python3-pytest python3-pil gcc g++ wget curl unzip zip tar zlib1g-dev

      - name: Linux-Testprogramme sauber aus dem Quellcode erstellen
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-Browser-Uploads bewahren Ausfuehrungsrechte nicht verlaesslich.
          # Deshalb niemals hochgeladene Host-Binaries ausfuehren.
          make -C native_ps5 -B CXX=g++ -j 2
          test -x native_ps5/scanner-host
          test -x native_ps5/cover-test-cli
          test -x native_ps5/emulator-cover-test-cli

      # V1.1.30 is a fully integrated source tree. Never re-run the old
      # V1.1.10->V1.1.11 patch scripts against it: that would erase fixes.
      - name: V1.1.30 integrierten Source und Regression-Grenzen pruefen
        shell: bash
        run: |
          set -euo pipefail
          # Make silent guard failures actionable in GitHub Actions logs.
          trap 'rc=$?; echo "::error::BGH Vorpruefung fehlgeschlagen in Zeile $LINENO: $BASH_COMMAND (Exit $rc)"; exit "$rc"' ERR
          echo "Pruefe BGH V1.1.30 auf Branch: $GITHUB_REF_NAME"
          test "$GITHUB_REF_NAME" = 'bgh-v1.1.30'
          # GitHub browser uploads can skip dotfiles (.keep). These files only
          # preserve otherwise-empty user gallery folders inside the PS5 ZIP.
          # Recreate missing placeholders instead of blocking the PS5 build.
          for kind in backgrounds logos; do
            folder="user_themes/$kind"
            if [[ ! -f "$folder/.keep" ]]; then
              echo "::notice::BGH Galerie-Platzhalter wird erstellt: $folder/.keep"
              mkdir -p "$folder"
              : > "$folder/.keep"
            fi
          done
          echo 'BGH Galeriewege bereit; pruefe Quellcode und Regressionstests.'
          grep -Fq 'BGH V1.1.30' native_ps5/universal_launcher.cpp
          grep -Fq 'libScePad.so' tooling/install_ui_kit_overlay.py
          grep -Fq 'controllers_.poll();' native_ps5/universal_launcher.cpp
          grep -Fq 'controllers_.observe_primary(input.connected);' native_ps5/universal_launcher.cpp
          grep -Fq 'BGH_BawertLs_Game_Hub_V1_1_30_' tooling/build_native_ps5.sh
          test -s native_ps5/launcher_client.cpp
          test -s native_ps5/ftp_scan.cpp
          test -s native_ps5/ftp_ps2_writer.cpp
          test -s native_ps5/storage_shadowmount.hpp
          test -s native_ps5/bgh_gallery_ftp.hpp
          # V1.1.30 has bundled-only galleries; the old logo FTP imports
          # MUST NOT run when opening the new fixed Logo gallery.
          if grep -Fq 'import_from_local_filesystem(kind)' native_ps5/universal_launcher.cpp ||
             grep -Fq 'import_from_local_ftp(kind)' native_ps5/universal_launcher.cpp; then
            echo 'BLOCKER: veralteter FTP-/Dateiimport im Launcher-Galeriepfad'; exit 1
          fi
          grep -Fq 'gallery_choices_=ulg::bgh_gallery::builtins(kind);' native_ps5/universal_launcher.cpp
          grep -Fq 'builtin_logo_preview' native_ps5/universal_launcher.cpp
          grep -Fq 'logo_has_embedded_wordmark(gallery_selection_.logo)' native_ps5/universal_launcher.cpp
          grep -Fq 'bgh_gallery_ftp.hpp' tooling/build_native_ps5.sh
          # Two PS5 home-screen DDS graphics must be included as a matched pair.
          python3 tooling/verify_ps5_home_background.py sce_sys/pic0.dds sce_sys/pic1.dds
          test -s design/ps5_home_hero_source.png
          test -s tooling/encode_ps5_bc7_mode6.cpp
          grep -Fq 'cp "$PROJECT/sce_sys/$background" "$KIT/sce_sys/$background"' tooling/build_native_ps5.sh
          test -s assets/themes/storage_internal.png
          test -s assets/themes/storage_usb.png
          test -s assets/themes/backgrounds/gaming_hall_2k.png
          for art in neon_corridor metal_blue neon_wall orbital_horizon blue_hall; do
            test -s "assets/themes/backgrounds/$art.jpg"
          done
          for art in lake showroom mountain_crown gaming_hall neon_corridor metal_blue neon_wall orbital_horizon blue_hall; do
            test -s "assets/themes/backgrounds/previews/$art.png"
          done
          grep -Fq 'gallery_choices_=ulg::bgh_gallery::builtins(ulg::bgh_gallery::Kind::background);' native_ps5/universal_launcher.cpp
          grep -Fq '"gaming_hall", "/app0/assets/themes/backgrounds/gaming_hall_2k.png"' native_ps5/bgh_theme_gallery.hpp
          for id in a01_chrom_orbit a02_brush_neon a03_tech_krone a04_gold_edel a05_controller b01_chrom_wappen b02_brush_blue b03_multikonsole b04_gold_krone b05_neon_rahmen c01_chrom_krone c02_brush_krone c03_klassisch c04_planet c05_edge_tech; do
            test -s "assets/themes/logos/$id.png"
            test -s "assets/themes/logos/previews/$id.png"
          done
          test -f user_themes/backgrounds/.keep
          test -f user_themes/logos/.keep
          test -s tooling/append_user_theme_folders.py
          grep -Fq 'BGH_GALLERY_UPLOAD_ROOT "/backgrounds"' native_ps5/bgh_theme_gallery.hpp
          grep -Fq 'BGH_GALLERY_UPLOAD_ROOT "/logos"' native_ps5/bgh_theme_gallery.hpp
          test -s assets/ui/pad_active.png
          test -s assets/ui/pad_inactive.png
          if grep -Eq 'statvfs[[:space:]]*\(' native_ps5/universal_launcher.cpp native_ps5/bgh_storage_metrics.hpp; then
            echo 'BLOCKER: unsafe PS5 statvfs reintroduced'; exit 1
          fi
          /usr/bin/python3 -m pytest -q tests/test_v1112_ui_polish.py tests/test_v1113_ui_persist.py tests/test_v114_shadowmount.py tests/test_v1116_pad_diagnostics.py tests/test_v1117_ui_pad_import.py tests/test_v1118_settings_hub.py tests/test_v1119_visual_polish.py tests/test_v1120_ps2_rpcs3_icons.py tests/test_v1217_ps2_autostart.py tests/test_v119_emulator_library_and_ps3_art.py tests/test_v1121_themes_footer.py tests/test_v1122_gallery_ftp.py tests/test_v1123_gallery_fix.py tests/test_v1124_builtin_background.py tests/test_v1125_background_grid.py tests/test_v1126_logo_gallery.py tests/test_v1126_fix1_workflow.py tests/test_v1127_ps5_home_icon.py tests/test_v1128_ps5_system_icon.py tests/test_v1129_fix1_icon_hash.py tests/test_v1130_ps5_home_background.py

      - name: Build-check of actual patched native C++ code
        shell: bash
        run: |
          set -euo pipefail
          bash tooling/test_native_gui_syntax.sh
          bash tests/run_bgh_addons_tests.sh

      - name: Create true full-source backup of integrated checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/backup/BGH_V1.1.30
          cp -a native_ps5 tooling assets design user_themes tests sce_sys .github README.md LICENSE build/backup/BGH_V1.1.30/
          test -s build/backup/BGH_V1.1.30/tooling/bgh_startup_guard_v1111.py
          (cd build/backup && zip -q -r ../BGH_V1.1.30_KOMPLETTPROJEKT.zip BGH_V1.1.30)

      - name: Upload full source backup
        uses: actions/upload-artifact@v7
        with:
          name: BGH-V1-1-30-KOMPLETTPROJEKT
          path: build/BGH_V1.1.30_KOMPLETTPROJEKT.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: JPG/TGA-Bilddekoder mit gepinntem stb_image testen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/host-stb
          curl --fail --location --retry 3 --connect-timeout 20 \
            https://raw.githubusercontent.com/nothings/stb/2c980bb59875b0d32144a71867fbdebb2f77cd20/stb_image.h \
            -o build/host-stb/stb_image.h
          test "$(git hash-object build/host-stb/stb_image.h)" = 9eedabedc45b3e6fd88fae6f14a160b4d53272ec
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Wno-error=unused-parameter \
            -Inative_ps5 -Ibuild/host-stb \
            native_ps5/cover_decode_test_cli.cpp native_ps5/cover_image.cpp \
            native_ps5/cover_png.cpp -lz -o build/cover-decode-host
          python3 tooling/test_host_cover_decode.py build/cover-decode-host
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Wno-error=unused-parameter \
            -Inative_ps5 -Ibuild/host-stb \
            native_ps5/cover_decode_test_cli.cpp native_ps5/cover_image.cpp \
            native_ps5/cover_png.cpp native_ps5/cover_metadata_denied_test.cpp \
            -Wl,--wrap=lstat -lz -o build/cover-decode-metadata-denied
          python3 tooling/test_host_cover_decode.py build/cover-decode-metadata-denied

      # The pinned UI kit expects a precompiled ps5-opengl SDK 1.0.2.
      # Its old release URL now returns HTTP 404; build/verify SDK from pinned source.
      - name: PS5 OpenGL SDK Werkzeuge und LLVM 21 installieren
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.asc"
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.asc" | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$fingerprint" = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          sudo install -m 0644 "$RUNNER_TEMP/llvm.asc" /usr/share/keyrings/llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang-21 lld-21 llvm-21-dev cmake bison flex \
            glslang-tools spirv-tools libegl-dev libgl-dev \
            libegl-mesa0 libgl1-mesa-dri libglx-mesa0 \
            python3-venv libasan8 libubsan1

      - name: PS5 OpenGL SDK 1.0.2 aus Cache laden
        id: bgh_opengl_cache
        uses: actions/cache/restore@v4
        with:
          path: build/ps5-opengl-sdk-1.0.2
          key: bgh-opengl-1.0.2-a51956162693-llvm21-noble-${{ hashFiles('tooling/build_pinned_opengl_sdk.sh') }}

      - name: PS5 OpenGL SDK 1.0.2 aus Quellcode vorbereiten und verifizieren
        shell: bash
        run: |
          set -euo pipefail
          kit="$GITHUB_WORKSPACE/build/ps5/ps5-homebrew-ui"
          prefix="$GITHUB_WORKSPACE/build/ps5-opengl-sdk-1.0.2"
          source_dir="$GITHUB_WORKSPACE/build/ps5-opengl-source-1.0.2"
          bash tooling/fetch_pinned_ui_kit.sh "$kit" bbe19054ee2e7ec069254775273aeb8846c4bd3e
          # Use an isolated Python for SDK-build tools only; normal BGH tests use /usr/bin/python3.
          if [[ ! -d "$prefix" ]]; then
            /usr/bin/python3 -m venv "$RUNNER_TEMP/bgh-opengl-build-venv"
            "$RUNNER_TEMP/bgh-opengl-build-venv/bin/python" -m pip install \
              'meson==1.10.1' 'Mako==1.3.10' 'PyYAML==6.0.2' 'packaging==25.0'
            export PATH="$RUNNER_TEMP/bgh-opengl-build-venv/bin:$PATH"
          fi
          bash tooling/build_pinned_opengl_sdk.sh "$kit" "$prefix" "$source_dir"
          (cd "$prefix" && sha256sum --check --strict --quiet manifest.sha256)
          for f in include/EGL/egl.h include/GL/glcorearb.h \
                   include/ps5_opengl_display.h lib/libPS5OpenGL.a \
                   lib/libSceAgc.so lib/libSceAgcDriver.so; do
            test -s "$prefix/$f"
          done
          echo "PS5_OPENGL_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Verifiziertes OpenGL SDK 1.0.2 im GitHub Cache sichern
        if: steps.bgh_opengl_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ps5-opengl-sdk-1.0.2
          key: bgh-opengl-1.0.2-a51956162693-llvm21-noble-${{ hashFiles('tooling/build_pinned_opengl_sdk.sh') }}

      - name: Echte native PS5-Anwendung aus V1.1.30 bauen
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          mkdir -p build
          test -s "${PS5_OPENGL_PREFIX:?missing OpenGL SDK prefix}/manifest.sha256"
          BUILD_JOBS=4 bash tooling/build_native_ps5.sh 2>&1 | tee build/native-ps5-build.log

      - name: Fertiges Paket und BGH-Branding pruefen
        shell: bash
        run: |
          set -euo pipefail
          python3 tooling/verify_ps5_package.py \
            build/ps5/BGH_BawertLs_Game_Hub_V1_1_30_PPSA99079_PS5_TEST.zip PPSA99079
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          source = pathlib.Path('sce_sys/icon0.png').read_bytes()
          expected_icon_sha256 = '17b7104e4681ad78d86504259dd25a6e4ba70e0a59d1bdc46cff8d91e966ae7d'
          if hashlib.sha256(source).hexdigest() != expected_icon_sha256:
              raise SystemExit('FEHLER: Falsches oder altes PS5-BGH-Systemicon im Source')
          package = pathlib.Path('build/ps5/BGH_BawertLs_Game_Hub_V1_1_30_PPSA99079_PS5_TEST.zip')
          with zipfile.ZipFile(package) as z:
              prefix = 'PPSA99079/'
              meta = json.loads(z.read(prefix + 'sce_sys/param.json'))
              names = [x.get('titleName', '') for x in meta['localizedParameters'].values() if isinstance(x, dict)]
              if "BGH - BawertL's Game Hub" not in names:
                  raise SystemExit('FEHLER: PS5-App-Name ist nicht BGH: ' + repr(names))
              if z.read(prefix + 'sce_sys/icon0.png') != source:
                  raise SystemExit('FEHLER: Das BGH-Menue-Icon fehlt oder stimmt nicht ueberein')
              # Home hero must match the source DDS byte-for-byte; upstream
              # init/packaging may otherwise reintroduce the kit's default banner.
              import sys
              sys.path.insert(0, 'tooling')
              from verify_ps5_home_background import verify_dds_bytes
              for art in ('pic0.dds','pic1.dds'):
                  source_bg = pathlib.Path('sce_sys',art).read_bytes()
                  verify_dds_bytes(source_bg)
                  target = prefix + 'sce_sys/' + art
                  if target not in z.namelist() or z.read(target) != source_bg:
                      raise SystemExit('FEHLER: Neues BGH PS5-Hauptseitenbild fehlt oder wurde ueberschrieben: ' + art)
              if prefix + 'assets/ui/controller.png' not in z.namelist() or prefix + 'assets/premium_lake_background.png' not in z.namelist() or prefix + 'assets/ui/cover_frame_active.png' not in z.namelist() or prefix + 'assets/ui/cover_shadow.png' not in z.namelist() or prefix + 'assets/ui/fan_case_header_ps5.png' not in z.namelist() or prefix + 'assets/ui/fan_case_header_ps4.png' not in z.namelist() or prefix + 'assets/ui/fan_case_header_switch.png' not in z.namelist():
                  raise SystemExit('FEHLER: Cover-Header-Grafikdateien fehlen im PS5-Paket')
              from io import BytesIO
              from PIL import Image
              with Image.open(BytesIO(z.read(prefix + 'assets/ui/cover_frame_active.png'))) as overlay:
                  if overlay.mode != 'RGBA' or overlay.getchannel('A').getextrema()[0] != 0:
                      raise SystemExit('FEHLER: Cover-Rahmen hat keine echte Alpha-Transparenz')
              if prefix + 'assets/ui/serif_atlas.png' not in z.namelist():
                  raise SystemExit('FEHLER: Serifenschrift-Grafik fehlt im PS5-Paket')
              if prefix + 'assets/bgh_logo.png' not in z.namelist():
                  raise SystemExit('FEHLER: Das BGH-Logo fehlt im App-Paket')
              for new_asset in (
                  'assets/themes/backgrounds/cyber_showroom.png',
                  'assets/themes/backgrounds/gaming_hall_2k.png',
                  'assets/themes/backgrounds/bgh_berg_cyber_mit_kronenlogo.png',
                  'assets/themes/logos/bgh_kronenlogo_freigestellt.png',
                  'assets/themes/storage_internal.png','assets/themes/storage_usb.png',
                  *(f'assets/themes/backgrounds/{name}.jpg' for name in
                    ('neon_corridor','metal_blue','neon_wall','orbital_horizon','blue_hall')),
                  *(f'assets/themes/backgrounds/previews/{name}.png' for name in
                    ('lake','showroom','mountain_crown','gaming_hall','neon_corridor',
                     'metal_blue','neon_wall','orbital_horizon','blue_hall'))):
                  if prefix + new_asset not in z.namelist():
                      raise SystemExit('FEHLER: NextGen Motiv nicht im PS5-Paket: ' + new_asset)
              for logo_id in ('a01_chrom_orbit','a02_brush_neon','a03_tech_krone',
                              'a04_gold_edel','a05_controller','b01_chrom_wappen',
                              'b02_brush_blue','b03_multikonsole','b04_gold_krone',
                              'b05_neon_rahmen','c01_chrom_krone','c02_brush_krone',
                              'c03_klassisch','c04_planet','c05_edge_tech'):
                  for rel in (f'assets/themes/logos/{logo_id}.png',
                              f'assets/themes/logos/previews/{logo_id}.png'):
                      if prefix + rel not in z.namelist():
                          raise SystemExit('FEHLER: Fest eingebautes BGH-Logo fehlt im PS5-Paket: ' + rel)
              if prefix + 'assets/bgh_wordmark.png' not in z.namelist():
                  raise SystemExit('FEHLER: Das neue BGH-Schriftlogo fehlt im Paket')
              if prefix + 'assets/audio/music/BGH_EccoTidesOfTime.ogg' not in z.namelist():
                  raise SystemExit('FEHLER: BGH-Hintergrundmusik fehlt im PS5-Paket')
              if prefix + 'assets/titles.conf' not in z.namelist():
                  raise SystemExit('FEHLER: Die PS4-Titelnamen-Konfiguration fehlt')
              if b'CUSA00031|Rayman Legends' not in z.read(prefix + 'assets/titles.conf'):
                  raise SystemExit('FEHLER: Die PS4-CUSA-Namen wurden nicht paketiert')
              if b'PS4|/user/app' not in z.read(prefix + 'assets/paths.conf'):
                  raise SystemExit('FEHLER: Der PS4-PKG-Installationspfad fehlt')
              for gallery_dir in ('user_themes/backgrounds/', 'user_themes/logos/'):
                  if prefix + gallery_dir not in z.namelist() or prefix + gallery_dir + '.keep' not in z.namelist():
                      raise SystemExit('FEHLER: FTP-Galerieordner fehlt: ' + gallery_dir)
              binary = z.read(prefix + 'eboot.bin')
              if b'BGH V1.1.30' not in binary:
                  raise SystemExit('FEHLER: Die BGH-Design-Buildkennung fehlt in eboot.bin')
              if b'@BGH_GIT_COMMIT@' in binary:
                  raise SystemExit('FEHLER: Nicht ersetzter Build-Platzhalter in eboot.bin')
          print('Bestaetigt: BGH-Icon, Hauptseitenhintergruende pic0/pic1 und Branding im PS5-Paket.')
          PY
          sha256sum build/ps5/BGH_BawertLs_Game_Hub_V1_1_30_PPSA99079_PS5_TEST.zip

      - name: Fertige PS5-ZIP direkt zum Download anbieten
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: BGH-V1-1-30-PPSA99079
          path: build/ps5/BGH_BawertLs_Game_Hub_V1_1_30_PPSA99079_PS5_TEST.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Fehlerprotokoll bereitstellen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: BGH-V1-1-30-Build-Fehler
          path: build/native-ps5-build.log
          if-no-files-found: warn
          retention-days: 14
