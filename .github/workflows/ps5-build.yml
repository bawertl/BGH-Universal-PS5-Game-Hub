name: PS5 Universal Game Launcher V0.6 - Native PS5 Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: V0.6 - PS5 eboot.bin and package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: V0.6-Quellcode ueberpruefen und entpacken
        shell: bash
        run: |
          set -euo pipefail
          zip=PS5_Universal_Game_Launcher_V0_6_GITHUB_SOURCE.zip
          test -s "$zip" || { echo 'V0.6-Quellcode-ZIP fehlt im Repository!'; exit 1; }
          echo 'fa7771d23c45daadcee00b8b502fae8ab75361d4d5dadda5921d236125c162ff  PS5_Universal_Game_Launcher_V0_6_GITHUB_SOURCE.zip' | sha256sum -c -
          mkdir -p v06
          unzip -qo "$zip" -d v06
          test -f v06/native_ps5/universal_launcher.cpp
          test -f v06/native_ps5/ftp_readonly.cpp
          test -f v06/native_ps5/root_manager.cpp
          test -f v06/tooling/build_native_ps5.sh

      - name: Oeffentliche PS5-Buildwerkzeuge installieren
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-format-18 clang-tidy-18 lld-18 llvm-18 \
            make git ninja-build ccache pkg-config python3 python3-pip python3-venv \
            python3-pytest gcc g++ wget curl unzip zip tar zlib1g-dev

      - name: V0.6-Tests und GUI-Syntaxpruefung
        shell: bash
        working-directory: v06
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          python3 -m pytest -q tests
          bash tooling/test_native_gui_syntax.sh

      - name: Native PS5-Anwendung kompilieren und pruefen
        shell: bash
        working-directory: v06
        run: |
          set -euo pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          mkdir -p build
          BUILD_JOBS=4 bash tooling/build_native_ps5.sh 2>&1 | tee build/native-ps5-build.log
          python3 tooling/verify_ps5_package.py \
            build/ps5/PS5_Universal_Game_Launcher_V0_6_PPSA99079_PS5_TEST.zip PPSA99079
          sha256sum build/ps5/PS5_Universal_Game_Launcher_V0_6_PPSA99079_PS5_TEST.zip

      - name: Fertige PS5-Testanwendung bereitstellen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PS5-Universal-Game-Launcher-V0.6-TEST
          path: v06/build/ps5/PS5_Universal_Game_Launcher_V0_6_PPSA99079_PS5_TEST.zip
          if-no-files-found: error
          retention-days: 14

      - name: Fehlerprotokoll bereitstellen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PS5-V0.6-Build-Fehler
          path: v06/build/native-ps5-build.log
          if-no-files-found: warn
          retention-days: 14
